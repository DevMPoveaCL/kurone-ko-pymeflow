services:
  postgres:
    image: postgres:16-alpine
    container_name: pymeflow-postgres
    environment:
      POSTGRES_DB: pymeflow
      POSTGRES_USER: pymeflow
      POSTGRES_PASSWORD: pymeflow_local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pymeflow -d pymeflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
